name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t policy-assistant .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name app policy-assistant
          sleep 5
          curl --fail http://localhost:8000/health
          curl --fail -X POST http://localhost:8000/ask \
            -H "Content-Type: application/json" \
            -d '{"question": "How do I change my beneficiary?"}'
